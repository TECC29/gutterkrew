<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A2E">
<title>29Cyber FieldProof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F0E8;--card:#FBFAF6;--ink:#14213A;--sub:#5B6372;--line:#D5D0C3;--band:#0E1A2E;--on-band:#F3F0E8;--vis:#C9A227;--navy:#0E1A2E;--gold:#C9A227;--blue:#1E5AA0;--red:#B3302A;--ok:#2E7D4F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0B1424;--card:#13203A;--ink:#ECE8DD;--sub:#9DA6B6;--line:#263652;--band:#070E1A;--on-band:#ECE8DD;--blue:#7FB0EA;--red:#E2685D;--ok:#3E9A63;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0B1424;--card:#13203A;--ink:#ECE8DD;--sub:#9DA6B6;--line:#263652;--band:#070E1A;--on-band:#ECE8DD;--blue:#6FA3E0;--red:#E2685D;--ok:#3E9A63;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:16px/1.5 Barlow,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3,.btn,.tab,.pc,label.f,.pill{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
h1{font-size:22px;margin:0;font-weight:700;line-height:1.15}
h2{font-size:21px;margin:24px 0 8px;font-weight:700}
h3{font-size:18px;margin:16px 0 6px;font-weight:600}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--band);color:var(--on-band);border-bottom:4px solid var(--vis)}
.top .hd{flex:1;min-width:0}.top h1{font-size:clamp(17px,4.8vw,22px)}.top .lang{gap:3px}.top .lang .btn{padding:0 9px}.top .hd h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:14px;opacity:.8}
.btn{min-height:44px;padding:0 16px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:6px;font-weight:600;font-size:17px;letter-spacing:.01em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.vis{background:var(--vis);border-color:var(--vis);color:#0E1A2E}
.btn.big{width:100%;min-height:52px;font-size:19px;margin-top:12px}
.btn.sm{min-height:38px;font-size:15px;padding:0 12px}
.btn.ghost{border-color:transparent}
.top .btn{color:var(--on-band);border-color:rgba(255,255,255,.25)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn[data-armed="1"]{background:var(--red);color:#fff;border-color:var(--red)}
input,textarea{width:100%;min-height:44px;padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:16px Barlow,Arial,sans-serif}
input.bad{border-color:var(--red)}
textarea{resize:vertical}
input[type=range]{min-height:28px;border:0;padding:0;background:transparent;accent-color:var(--blue)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--blue);margin:0}
label.f{display:block;font-weight:600;font-size:15px;margin:12px 0 4px;color:var(--sub)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.err{color:var(--red);font-size:15px;min-height:1.2em;margin:8px 0 0}
.hint{color:var(--sub);font-size:14px;margin:4px 0 0}
.msg{font-size:15px;margin:8px 0 0}
.lang{margin-left:auto;display:flex;gap:4px}
.lang button{min-height:36px;padding:0 10px}
.lang button[aria-pressed="true"]{background:var(--vis);color:#0E1A2E;border-color:var(--vis)}
.job{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:14px 0;border-bottom:1px solid var(--line)}
.jmain{cursor:pointer}
.jt{font-weight:600;font-size:18px}.js{color:var(--sub);font-size:14px}
.jact{grid-column:1/-1;display:flex;gap:8px}
.pill{align-self:start;font-weight:600;font-size:14px;padding:2px 8px;border-radius:4px}
.pill.draft{background:var(--line);color:var(--ink)}.pill.signed{background:var(--ok);color:#fff}
.empty{color:var(--sub);padding:16px 0}
.warn{background:var(--vis);color:#0E1A2E;padding:10px 12px;border-radius:6px;margin-top:12px;font-size:15px}
.gps{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}
.gps span{font-size:15px;color:var(--sub)}
.ed{display:grid;gap:12px;padding:12px;max-width:1400px;margin:0 auto}
@media(min-width:900px){.ed{grid-template-columns:minmax(0,1fr) 330px;align-items:start}.side{position:sticky;top:84px}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tab{flex:none;min-height:40px;padding:0 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-weight:600;font-size:15px;display:inline-flex;align-items:center;cursor:pointer}
.tab.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.vrow{display:flex;gap:8px;align-items:center;margin:4px 0 8px;flex-wrap:wrap}
.vrow input:not([type=range]){flex:1;min-width:140px}
.zm{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub)}.zm input{width:110px}
.stage{overflow:auto;max-height:64vh;border:1.5px solid var(--line);border-radius:6px;background:#7C8389;touch-action:none}
.stage svg{display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.it{cursor:grab}
.banner{background:var(--ok);color:#fff;padding:8px 12px;border-radius:6px;margin:4px 0 8px}
.nophoto{border:2px dashed var(--line);border-radius:8px;padding:32px 16px;text-align:center}
.pal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pc{min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;padding:4px;text-align:center;line-height:1.1}
.pc svg{width:30px;height:30px}
.selbox{border:2px solid var(--blue);border-radius:6px;padding:10px 12px;margin-top:10px;background:var(--card)}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.chk{display:flex;gap:8px;align-items:center;font-size:16px}
.bomc{margin-top:14px}
table.bom{width:100%;border-collapse:collapse}
.bom td{padding:6px 0;border-bottom:1px solid var(--line)}.bom td:last-child{text-align:right;font-weight:600}
dl.sum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0}
dl.sum dt{color:var(--sub);font-weight:500}dl.sum dd{margin:0}
.pad{width:100%;height:170px;background:#fff;border:1.5px dashed var(--sub);border-radius:6px;touch-action:none;display:block}
.sigimg{background:#fff;border-radius:6px;max-width:100%;height:120px;display:block;border:1px solid var(--line)}
.stmt{background:var(--card);border-left:4px solid var(--vis);padding:10px 12px;font-size:15px}
.hash{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;color:var(--sub)}
.acts{display:grid;gap:8px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:12px}
.gate{min-height:100vh;min-height:100dvh;background:var(--navy);color:#F3F0E8;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;position:relative}
.gate .lang{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px}
.gate .lang .btn{color:#F3F0E8;border-color:rgba(243,240,232,.3)}
.emblem{width:min(58vw,270px);height:auto;display:block;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
.hlogo{height:38px;width:auto;display:block;flex:none}
.appname{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;font-size:clamp(34px,9vw,52px);line-height:1;margin:22px 0 6px;letter-spacing:.01em}
.appname .b{color:var(--gold)}
.tag{color:#B9BFCB;font-size:16px;margin:0 0 28px;max-width:30ch}
.lform{width:100%;max-width:340px;text-align:left}
.lform label.f{color:#B9BFCB}
.lform input{background:#16253F;border-color:#2C3D5C;color:#F3F0E8}
.lform .btn.vis{margin-top:14px}
.lform .btn.line{width:100%;margin-top:10px;color:#F3F0E8;border-color:rgba(243,240,232,.3)}
.lnote{color:#8C95A5;font-size:14px;margin-top:16px;text-align:center}
.userchip{font-size:14px;opacity:.85}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.tright{display:flex;gap:6px;margin-left:auto}
.foot{display:flex;align-items:center;justify-content:center;gap:10px;margin:36px 0 10px;color:var(--sub);font-size:13px;line-height:1.4;text-align:left}
.gate .foot{color:#8C95A5}
.foot img{height:34px;width:auto}
.spin{color:var(--sub);padding:24px 0}
.bcard{border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;background:var(--card)}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.vrowl{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.vrowl .jmain{flex:1}
.tagv{font-size:12px;background:var(--line);border-radius:4px;padding:1px 6px}
.banner.gray{background:var(--line);color:var(--ink)}
.savest{font-size:13px;color:var(--sub);margin:2px 0 6px}.savest.bad{color:var(--red)}
.pill.open{background:var(--blue);color:#fff}.pill.converted{background:var(--ok);color:#fff}.pill.closed{background:var(--line);color:var(--ink)}
.lform .two .btn{width:100%}
.lform .btn.line{color:#F3F0E8;border-color:rgba(243,240,232,.3)}
.gate h2{color:#F3F0E8}
.prep{display:flex;flex-direction:column;gap:1px;border-left:4px solid var(--vis);background:var(--card);padding:10px 12px;margin-top:6px}
.prep b{font-size:17px}
.embed .top{position:sticky;top:0}
a{color:var(--blue)}
/* v2.2: crew on a job, completion */
.cmp{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;margin:6px 0 12px}
.cmp figure{margin:0 0 8px}.cmp figcaption{font-size:13px;color:var(--sub);margin-bottom:4px}
.thumb{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:6px;background:#7C8389}
.addph{min-height:110px;border:2px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub);font-weight:600;text-align:center;padding:8px}
.pcheck{border-top:1px solid var(--line);padding:8px 0}
.pch{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;gap:6px}
.seg .btn.on.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.seg .btn.on.chb{background:var(--vis);border-color:var(--vis);color:#0E1A2E}
.cwhy{margin-top:6px}
.compl{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.compl .jmain{flex:1}
.pill.done{background:var(--ok);color:#fff}
.crewl{display:grid;gap:8px;margin:8px 0}
.lnk{background:var(--card);border-left:4px solid var(--blue);padding:8px 12px;margin-top:10px;font-size:15px}

const foot=()=>`<footer class="foot"><img src="${LOGO_SRC}" alt=""><span><b>${esc(APP.name)}</b> v${esc(APP.version)}<br>Created by ${esc(APP.author)} · © 2026 ${esc(APP.vendor)}</span></footer>`;

// ─── Sign in (same accounts as CrewTrack) ───
function gate(msg){
  app.innerHTML=`<section class="gate">
  ${LOGO_SVG}<h1 class="appname"><span class="b">29Cyber</span> FieldProof</h1><p class="tag">${t('tagline')}</p>
  <div class="lform">
   <div class="two"><button class="btn sm ${loginType==='crew'?'vis':'line'}" data-act="lt" data-t="crew">Employee ID</button><button class="btn sm ${loginType==='admin'?'vis':'line'}" data-act="lt" data-t="admin">Email</button></div>
   ${loginType==='crew'?`<label class="f" for="lco">Company code</label><input id="lco" maxlength="6" autocapitalize="characters" value="${esc(lsCompany())}" style="text-transform:uppercase;letter-spacing:2px"><label class="f" for="lid">Employee ID (7 digits)</label><input id="lid" inputmode="numeric" maxlength="7" autocomplete="username">`
     :`<label class="f" for="lid">Email</label><input id="lid" type="email" autocomplete="username">`}
   <label class="f" for="lpw">Password</label><input id="lpw" type="password" autocomplete="current-password">
   <p id="lerr" class="err" role="alert">${esc(msg||'')}</p>
   <button class="btn vis big" data-act="login" id="lbtn">Sign in</button>
   <p class="lnote">Same account as CrewTrack. Access is turned on by your manager.</p>
  </div>${foot()}</section>`;
  const p=$('#lpw');if(p)p.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});}
async function doLogin(){
  const id=($('#lid').value||'').trim(),pw=$('#lpw').value||'',err=$('#lerr');
  if(!id||!pw){err.textContent='Enter your login and password.';return}
  if(loginType==='crew'&&!/^\d{7}$/.test(id)){err.textContent='The Employee ID has 7 digits.';return}
  let email=id;
  if(loginType==='crew'){const cc=normCode($('#lco')&&$('#lco').value);if(cc.length!==6){err.textContent='Enter the 6-character company code.';return}lsCompany(cc);email=`${id}.${cc.toLowerCase()}@${COMPANY.crewDomain}`;}
  const b=$('#lbtn');b.disabled=true;b.textContent='Signing in…';
  try{await fb().signInWithEmailAndPassword(fb().auth,email,pw);}
  catch(e){b.disabled=false;b.textContent='Sign in';err.textContent=loginType==='crew'?'Wrong company code, Employee ID or password.':'Wrong login or password.';}
}
function notice(icon,title,text,extra=''){
  app.innerHTML=`<section class="gate">${LOGO_SVG}<div class="lform" style="text-align:center"><div style="font-size:40px">${icon}</div><h2 style="margin:6px 0">${esc(title)}</h2><p class="tag" style="margin:0 auto 18px">${text}</p>${extra}<button class="btn line big" data-act="logout">Sign out</button></div>${foot()}</section>`;}
async function onUser(user){
  if(!user){session=null;TENANT=null;fb().setTenant(null);gate();return}
  // v3.0: the company of this login first.
  const mem=await fbGet(`members/${user.uid}`).catch(()=>null);
  if(!mem||!mem.tid){fb().setTenant(null);notice('🏢','No company','This login is not part of a company. Start one in CrewTrack, or ask your manager to add you.',`<a class="btn vis big" href="../index.html">Open CrewTrack</a>`);return}
  fb().setTenant(mem.tid);TENANT={tid:mem.tid,...(await fbGet(`tenants/${mem.tid}`).catch(()=>null)||{})};if(TENANT.code)lsCompany(TENANT.code);
  let p=null;try{p=await fbGet(`users/${user.uid}`);}catch(e){}
  if(!p){notice('⚠️','No profile','This login has no profile. Ask your manager.');return}
  if(p.status==='pending'){notice('⏳','Waiting for approval',`Hi ${esc(p.name)}. Your account is waiting for your manager's approval.`);return}
  if(p.mustChangePassword===true){notice('🔑','Set your password first','Your account has a temporary password. Open CrewTrack once to create your own password.',`<a class="btn vis big" href="../index.html">Open CrewTrack</a>`);return}
  if(!hasApp(p,'fieldproof')){notice('🔒','No access to FieldProof',`Hi ${esc(p.name)}. Your account does not have access to FieldProof yet. Ask your manager to turn it on.`,hasApp(p,'crewtrack')?`<a class="btn vis big" href="../index.html">Open CrewTrack</a>`:'');return}
  session={uid:user.uid,...p};
  try{RAWCO=await fbGet('config/company');CUSTOMER=cleanCompany(RAWCO);}catch(e){RAWCO=null;CUSTOMER=null}
  try{const c=await fbGet('config/fieldproof');WOLINK=!c||c.woLink!==false;}catch(e){WOLINK=true}
  const hs=hashSite();if(hs){clearHash();openSite(hs);}else home();
}
// CrewTrack opens a job with fieldproof/index.html?embed=1#site=ID ("Open job plan").
function hashSite(){const m=/[#&]site=([A-Za-z0-9]{1,40})/.exec(location.hash||'');return m?m[1]:''}
function clearHash(){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
window.addEventListener('hashchange',()=>{const id=hashSite();if(id&&session){clearHash();openSite(id)}});
// The job linked to the load I am on (by work order number in CrewTrack).
async function linkedJob(){if(!hasApp(session,'crewtrack'))return null;
  try{const al=await fbGet(`activeLoad/${session.uid}`);if(!al||!al.loadId)return null;const lk=await fbGet(`fpLinks/${al.loadId}`);if(!lk)return null;
    if(lk.revoked)return null;const s=await fbGet(`fpSites/${lk.siteId}`);return s?{fid:lk.siteId,...s,_link:lk}:null}catch(e){return null}}
// Work order number -> job, so the crew can open it by number. Kept by managers.
async function indexWo(id,wo,old){try{const k=woKey(wo),o=woKey(old);
  if(o&&o!==k){const w=await fbGet(`fpWo/${o}`);if(w&&w.siteId===id)await fbDel(`fpWo/${o}`)}
  if(k)await fbSet(`fpWo/${k}`,{siteId:id,wo})}catch(e){console.log('wo index',e)}}
async function syncWo(jobs){for(const j of jobs){const k=woKey(j.wo);if(!k||j.status!=='open')continue;try{const w=await fbGet(`fpWo/${k}`);if(!w)await fbSet(`fpWo/${k}`,{siteId:j.fid,wo:j.wo})}catch(e){console.log('wo sync',e)}}}
async function loadUsers(){try{return (await fbQuery('users')).filter(u=>u.status!=='pending'&&hasApp(u,'fieldproof')).map(u=>({uid:u.fid,name:u.name||'(no name)',role:u.role})).sort((a,b)=>a.name.localeCompare(b.name))}catch(e){console.log('users',e);return[]}}

// ─── Home: jobs, my site visits, all site visits (managers) ───
function topbar(back,title,sub,right=''){
  return `<header class="top">${back?`<button class="btn sm" data-act="${back}">${t('back')}</button>`:`<img class="hlogo" src="${LOGO_SRC}" alt="">`}<div class="hd"><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div>${right}</header>`;}
async function home(tab){
  if(tab)homeTab=tab;cur=null;site=null;selId=null;
  const right=EMBED?'':`<div class="tright">${hasApp(session,'crewtrack')?`<a class="btn sm" href="../index.html">CrewTrack</a>`:''}<button class="btn sm" data-act="logout">Sign out</button></div>`;
  app.innerHTML=topbar('',`<span style="color:var(--gold)">29Cyber</span> FieldProof`,esc(session.name)+(CUSTOMER?' · '+esc(CUSTOMER.name):''),right)+`<section class="wrap"><div class="spin">Loading…</div></section>`;
  let jobs=[],visits=[];
  try{
    const{where}=fb();
    if(isMgr()){const all=await fbQuery('fpSites');jobs=all.filter(x=>x.type==='job');visits=all.filter(x=>x.type==='visit');}
    else{const[a,b,lj]=await Promise.all([fbQuery('fpSites',where('crewUids','array-contains',session.uid)),fbQuery('fpSites',where('ownerUid','==',session.uid)),linkedJob()]);
      jobs=a.filter(x=>x.type==='job');visits=b.filter(x=>x.type==='visit');if(lj&&!jobs.some(x=>x.fid===lj.fid))jobs.unshift(lj);}
  }catch(e){console.log(e);$('.wrap').innerHTML=`<p class="err">Could not load. Check your connection.</p>`;return}
  const by=(a,b)=>(b._link?1:0)-(a._link?1:0)||tsDate(b.createdAt)-tsDate(a.createdAt);jobs.sort(by);visits.sort(by);
  if(isMgr()&&!woSynced){woSynced=true;syncWo(jobs)}
  const mine=visits.filter(v=>v.ownerUid===session.uid);
  const tabs=[['jobs','Jobs',jobs.length],['visits','My site visits',mine.length]];if(isMgr())tabs.push(['all','All site visits',visits.length]);
  if(!tabs.some(x=>x[0]===homeTab))homeTab='jobs';
  const list=homeTab==='jobs'?jobs:homeTab==='visits'?mine:visits;
  const row=s=>`<article class="job"><div class="jmain" data-act="openSite" data-id="${esc(s.fid)}">
     <div class="jt">${s.type==='job'?'WO '+esc(s.wo)+' · ':''}${esc(s.condo||s.address||'(no address)')}</div>
     <div class="js">${s._link?`<b>Your truck ${esc(s._link.truck)} · work order ${esc(s._link.wo)}</b> · `:''}${s.client?'For '+esc(s.client.name)+' · ':''}${s.type==='visit'?esc(KIND[s.kind]||'Site visit')+' · ':''}${esc(s.address&&s.condo?s.address:'')}${homeTab==='all'?' · '+esc(s.ownerName||''):''}${isMgr()&&s.type==='job'?' · Crew: '+((s.crewUids||[]).length||'none'):''} · ${fmt(s.createdAt)}</div></div>
     <span class="pill ${esc(s.status)}">${esc(STATUS[s.status]||s.status)}</span></article>`;
  $('.wrap').innerHTML=planBar()+`<div class="acts" style="margin-top:0">${isMgr()?`<button class="btn vis" data-act="newSite" data-t="job">+ New job</button>`:''}<button class="btn ${isMgr()?'':'vis'}" data-act="newSite" data-t="visit">+ New site visit</button></div>
   <div class="tabs" style="margin-top:16px">${tabs.map(([k,n,c])=>`<button class="tab ${k===homeTab?'on':''}" data-act="tab" data-t="${k}">${n} (${c})</button>`).join('')}</div>
   ${list.length?list.map(row).join(''):`<p class="empty">${homeTab==='jobs'?(isMgr()?'No jobs yet. Create one, or open a site visit and turn it into a job.':'No jobs for you yet. Your manager assigns the jobs'+(hasApp(session,'crewtrack')&&WOLINK?', or type the work order number in CrewTrack when you load the truck.':'.')):'No site visits yet. Start one when you reach a site.'}</p>`}
   ${isMgr()&&homeTab==='jobs'?`<div class="selbox" style="margin-top:22px"><label class="chk"><input type="checkbox" id="woLink" ${WOLINK?'checked':''}> Crew can open a job by typing its work order number</label><p class="hint">In CrewTrack, while they are on an open load. Each link is recorded on the job. Turn this off if your work order numbers are easy to guess; assigning crew to a job always works.</p><p id="wlmsg" class="msg" role="status"></p></div>`:''}
   ${foot()}`;
}

let siteDraft=null;

  siteDraft=s?{...s}:{type,kind:'field',wo:'',condo:'',address:'',notes:''};
  const isJob=siteDraft.type==='job';
  app.innerHTML=topbar(s?'backSite':'home',s?(isJob?'Job details':'Site visit details'):(isJob?'New job':'New site visit'),'')+`<section class="wrap">
   ${isJob?`<label class="f" for="f_wo">Work order *</label><input id="f_wo" value="${esc(siteDraft.wo)}" maxlength="40" autocomplete="off">`
    :`<label class="f">Type</label><div class="two"><button class="btn ${siteDraft.kind==='field'?'vis':''}" data-act="kind" data-k="field">Field notes</button><button class="btn ${siteDraft.kind==='lead'?'vis':''}" data-act="kind" data-k="lead">Sales lead</button></div>`}
   <h3>Client company <span class="hint">(optional, shown as "Prepared for" on the PDF)</span></h3>
   <label class="f" for="c_name" style="margin-top:4px">Company name</label><input id="c_name" list="clientlist" value="${esc(siteDraft.client?.name||'')}" maxlength="120" autocomplete="off">
   <datalist id="clientlist">${savedClients().map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>
   <div class="two">${CF.slice(1,3).map(([k,l])=>`<div><label class="f" for="c_${k}">${l}</label><input id="c_${k}" value="${esc(siteDraft.client?.[k]||'')}" maxlength="${k==='phone'?40:120}" autocomplete="off"></div>`).join('')}</div>
   ${CF.slice(3).map(([k,l])=>`<label class="f" for="c_${k}">${l}</label><input id="c_${k}" value="${esc(siteDraft.client?.[k]||'')}" maxlength="${k==='address'?200:120}" autocomplete="off" ${k==='email'?'type="email" inputmode="email"':''}>`).join('')}
   <h3>Site</h3>
   <label class="f" for="f_condo">${t('condo')}</label><input id="f_condo" value="${esc(siteDraft.condo)}" maxlength="120" autocomplete="off">
   <label class="f" for="f_address">${t('address')}</label><input id="f_address" value="${esc(siteDraft.address)}" maxlength="200" autocomplete="off">
   <label class="f" for="f_notes">Notes</label><textarea id="f_notes" rows="4" maxlength="4000">${esc(siteDraft.notes)}</textarea><p class="hint">${t('dictHint')}</p>
   <p id="ferr" class="err" role="alert"></p>
   <button class="btn vis big" data-act="saveSite">Save</button>${foot()}</section>`;
}
async function saveSite(){
  const g=k=>($('#f_'+k)?.value||'').trim(),err=$('#ferr');
  const d=siteDraft;d.condo=g('condo').slice(0,120);d.address=g('address').slice(0,200);d.notes=g('notes').slice(0,4000);
  if(d.type==='job'){d.wo=g('wo').slice(0,40);if(!d.wo){err.textContent='Fill in the work order.';return}}
  if(!d.condo&&!d.address){err.textContent=t('needAddr');return}
  const cv=k=>($('#c_'+k)?.value||'').trim();
  const anyC=CF.some(([k])=>cv(k));
  if(anyC&&!cv('name')){err.textContent='Fill in the client company name, or clear the client fields.';return}
  d.client=anyC?{name:cv('name').slice(0,120),contact:cv('contact').slice(0,120),phone:cv('phone').slice(0,40),email:cv('email').slice(0,120),address:cv('address').slice(0,200)}:null;
  rememberClient(d.client);
  try{
    if(d.fid){
      const up={condo:d.condo,address:d.address,notes:d.notes,client:d.client,updatedAt:now()};
      if(d.type==='job')up.wo=d.wo;else up.kind=d.kind;
      const oldWo=site&&site.fid===d.fid?site.wo:'';
      await fbUpdate(`fpSites/${d.fid}`,up);
      if(d.type==='job'&&woKey(oldWo)!==woKey(d.wo))await indexWo(d.fid,d.wo,oldWo);
      openSite(d.fid);
    }else{
      const id=newId();
      const rec={type:d.type,kind:d.type==='visit'?d.kind:'',wo:d.type==='job'?d.wo:'',condo:d.condo,address:d.address,notes:d.notes,
        status:'open',ownerUid:session.uid,ownerName:session.name,fromVisit:'',jobId:'',client:d.client,createdAt:now(),updatedAt:now()};
      if(d.type==='job')rec.crewUids=[];
      await fbSet(`fpSites/${id}`,rec);
      if(d.type==='job')await indexWo(id,d.wo,'');
      openSite(id);
    }
  }catch(e){console.log(e);err.textContent=e.code==='permission-denied'?'Not allowed with your access.':'Could not save. Check your connection.';}
}

// ─── Site page: details, actions, buildings with versions ───
const canAdd=s=>!!s&&hasApp(session,'fieldproof')&&s.status==='open'&&(s.type==='job'||s.ownerUid===session.uid||isMgr());
async function openSite(id){
  app.innerHTML=topbar('home','Loading…','')+`<section class="wrap"><div class="spin">Loading…</div></section>`;
  try{
    const s=await fbGet(`fpSites/${id}`);if(!s){home();return}
    site={fid:id,...s};linkedVisit=null;
    let ps=(await fbQuery(`fpSites/${id}/proofs`)).map(p=>({...p,id:p.fid,_site:id}));
    if(site.type==='job'&&site.fromVisit){try{const v=await fbGet(`fpSites/${site.fromVisit}`);if(v){linkedVisit={fid:site.fromVisit,...v};const vp=(await fbQuery(`fpSites/${site.fromVisit}/proofs`)).map(p=>({...p,id:p.fid,_site:site.fromVisit,_fromVisit:1}));ps=vp.concat(ps);}}catch(e){console.log('visit',e)}}
    proofs=ps;comps=[];links=[];
    if(site.type==='job'){
      try{comps=(await fbQuery(`fpSites/${id}/completions`)).map(c=>({...c,id:c.fid}))}catch(e){console.log('completions',e)}
      if(isMgr()){const{where}=fb();try{links=await fbQuery('fpLinks',where('siteId','==',id))}catch(e){console.log('links',e)}if(!USERS)USERS=await loadUsers();}
    }
    renderSite();
  }catch(e){console.log(e);app.querySelector('.wrap').innerHTML=`<p class="err">${e&&e.code==='permission-denied'?'This job is not open to you. Ask your manager to assign you, or link its work order to your load in CrewTrack.':'Could not open. Check your connection.'}</p>`;}
}
function renderSite(){
  const s=site,isJob=s.type==='job';
  const title=isJob?`WO ${esc(s.wo)}`:esc(KIND[s.kind]||'Site visit');
  const groups={};proofs.forEach(p=>{(groups[p.bldg]=groups[p.bldg]||[]).push(p)});
  Object.values(groups).forEach(g=>g.sort((a,b)=>(a.version-b.version)||(tsDate(a.createdAt)-tsDate(b.createdAt))));
  const owner=s.ownerUid===session.uid;
  const acts=[];
  if(isMgr()&&s.type==='visit'&&s.status==='open')acts.push(`<button class="btn vis" data-act="convert">Create job from this visit</button>`);
  if(isMgr()&&s.type==='visit'&&s.kind==='lead'&&s.status==='open')acts.push(`<button class="btn" data-act="closeSite">Close – no sale</button>`);
  if(isMgr()&&s.type==='job')acts.push(`<button class="btn" data-act="${s.status==='open'?'closeSite':'reopenSite'}">${s.status==='open'?'Close job':'Reopen job'}</button>`);
  if(isMgr()&&s.type==='visit'&&s.status==='closed')acts.push(`<button class="btn" data-act="reopenSite">Reopen</button>`);
  if((isMgr()&&(isJob||s.status!=='converted'))||(owner&&s.type==='visit'&&s.status==='open'))acts.push(`<button class="btn" data-act="editSite">Edit details</button>`);
  const vrow=p=>{const mine=p.authorUid===session.uid&&p.status==='draft'&&!p._fromVisit;
    return `<div class="vrowl"><div class="jmain" data-act="openProof" data-id="${esc(p.id)}" data-s="${esc(p._site)}"><b>v${p.version}</b> · ${p.status==='signed'?`Signed ${fmt(p.signedAt)} by ${esc(p.sig?.instName||p.authorName)}${p.sig?.supName?` · site supervisor ${esc(p.sig.supName)}`:''}`:`Draft by ${esc(p.authorName)}`}${p._fromVisit?' <span class="tagv">from site visit</span>':''}</div>
      <span class="pill ${p.status}">${STATUS[p.status]}</span>${mine?`<button class="btn sm danger" data-act="delProof" data-id="${esc(p.id)}">Delete</button>`:''}</div>`;};
  const crow=c=>`<div class="compl"><div class="jmain" data-act="openComp" data-id="${esc(c.id)}"><b>Completion</b> of plan v${c.planVersion} · ${c.status==='signed'?`Signed ${fmt(c.signedAt)} by ${esc(c.sig?.name||c.authorName)}`:`In progress by ${esc(c.authorName)}`}</div><span class="pill ${c.status==='signed'?'done':'draft'}">${c.status==='signed'?'Completed':'Draft'}</span></div>`;
  const doneOf=sg=>!!sg&&comps.some(c=>c.id===sg.id&&c.status==='signed');
  const bl=Object.keys(groups).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).map(b=>{const g=groups[b],last=g[g.length-1],signed=[...g].reverse().find(p=>p.status==='signed');
    const cs=isJob?comps.filter(c=>c.bldg===b).sort((x,y)=>y.planVersion-x.planVersion):[],cHere=signed&&comps.find(c=>c.id===signed.id);
    return `<div class="bcard"><div class="bh"><h3 style="margin:0">Building ${esc(b)}${doneOf(signed)?' <span class="pill done">Completed</span>':''}</h3><span class="js">${esc(last.model||'')}</span></div>${g.map(vrow).join('')}${cs.map(crow).join('')}
      <div class="row">${canAdd(s)&&signed?`<button class="btn sm" data-act="newVersion" data-id="${esc(signed.id)}" data-s="${esc(signed._site)}">New version</button>`:''}
      ${isJob&&canAdd(s)&&signed&&!cHere?`<button class="btn sm vis" data-act="newComp" data-id="${esc(signed.id)}" data-s="${esc(signed._site)}">Complete installation</button>`:''}</div></div>`;}).join('');
  const nb=Object.keys(groups).length,allDone=isJob&&nb>0&&Object.values(groups).every(g=>doneOf([...g].reverse().find(p=>p.status==='signed')));
  const crewNames=(s.crewUids||[]).map(u=>(USERS||[]).find(x=>x.uid===u)?.name||'(removed user)');
  const crewBlock=!isJob?'':isMgr()?`<h3>Crew on this job</h3><p style="margin:0">${crewNames.length?crewNames.map(esc).join(', '):'No one assigned yet.'}</p>
     <div class="row"><button class="btn sm" data-act="assign">Assign crew</button></div><div id="assignBox"></div>
     ${links.length?`<h3>Opened by work order</h3>${links.map(l=>`<div class="vrowl"><div style="flex:1">Truck ${esc(l.truck)} · ${esc(l.byName)} · work order ${esc(l.wo)} · ${fmt(l.at)}${l.revoked?`<br><span class="js">Removed by ${esc(l.revokedBy||'')} · ${fmt(l.revokedAt)}</span>`:''}</div>${l.revoked?'':`<button class="btn sm danger" data-act="unlink" data-id="${esc(l.fid)}">Remove</button>`}</div>`).join('')}`:''}`
    :((s.crewUids||[]).includes(session.uid)?`<p class="lnk">You are assigned to this job.</p>`:'');
  app.innerHTML=topbar('home',title,esc(s.condo||s.address||''))+`<section class="wrap">
   <dl class="sum">${isJob?`<dt>${t('wo')}</dt><dd>${esc(s.wo)}</dd>`:`<dt>Type</dt><dd>${esc(KIND[s.kind]||'')}</dd>`}<dt>${t('condo')}</dt><dd>${esc(s.condo)||'-'}</dd><dt>${t('address')}</dt><dd>${esc(s.address)||'-'}</dd>
   <dt>Client</dt><dd>${s.client?esc(s.client.name)+(clientLines(s.client).length?`<br><span class="js">${clientLines(s.client).map(esc).join(' · ')}</span>`:''):'-'}</dd>
